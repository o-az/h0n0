name: Checks
description: 'Run format, lint, type check, and build checks.'

runs:
  using: 'composite'
  steps:
    - name: 'Setup mise 🐭'
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: false

    - name: 'Install Dependencies'
      shell: bash
      run: |
        mise install
        bun install --frozen-lockfile
      env:
        NO_COLOR: 1

    - name: 'Run CI Tasks'
      shell: bash
      run: mise ci
