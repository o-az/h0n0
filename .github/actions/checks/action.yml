name: Checks
description: 'Run format, lint, type check, and build checks.'

runs:
  using: 'composite'
  steps:
    - name: 'Setup mise 🐭'
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      with:
        cache: false

    - name: 'Install Dependencies'
      shell: bash
      run: |
        bun install --frozen-lockfile
        mise install
      env:
        NO_COLOR: 1

    - name: 'Run CI Tasks'
      shell: bash
      run: mise ci
